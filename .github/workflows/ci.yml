# Every pull request and every push to main (specification 19.3, ADR-008).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Compiles, runs every test (PostgreSQL in Testcontainers) and checks formatting.
      - name: Verify
        working-directory: backend
        run: ./mvnw -B -ntp verify

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The tests saved the OpenAPI document; the committed TypeScript types must match it.
      - name: API types match the backend
        working-directory: frontend
        run: |
          npm ci --no-fund --no-audit
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts

  frontend:
    name: Frontend lint, types, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-fund --no-audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run format:check

  # The Playwright test of 16.4 (S20, ADR-038): the SPA in Chromium against the test application,
  # which runs PostgreSQL in Testcontainers and the fake models, so no real model is called.
  e2e:
    name: End-to-end test (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-fund --no-audit
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

      - name: Report of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  # The clean start of DEP-2: build both images, start the stack and call the API through nginx.
  stack:
    name: Compose stack starts and serves /meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # .env.example's signing key and admin password are invalid on purpose; CI generates both.
      # CI has no model key, so the stack runs without a chat model.
      - name: Environment from .env.example
        run: |
          cp .env.example .env
          sed -i "s|^APP_SECURITY_JWT_SECRET=.*|APP_SECURITY_JWT_SECRET=$(openssl rand -base64 32)|" .env
          sed -i "s/^APP_BOOTSTRAP_ADMIN_PASSWORD=.*/APP_BOOTSTRAP_ADMIN_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s/^CHAT_PROVIDER=.*/CHAT_PROVIDER=none/" .env

      - run: docker compose up --build -d --wait
      - run: curl -fsS http://localhost:3000/api/v1/meta

      # The bootstrap admin signs in through nginx, reads the current user, and refreshes the
      # session with the cookie from the sign-in (AUTH-3, AUTH-6, AUTH-9). Then a PDF goes up and
      # comes back unchanged, which needs the files volume to be writable, and a body above
      # nginx's limit gets a Problem Details 413 (DOC-1, DOC-6, ADR-031).
      - name: Sign in, upload and download through nginx
        run: |
          email=$(grep '^APP_BOOTSTRAP_ADMIN_EMAIL=' .env | cut -d= -f2-)
          password=$(grep '^APP_BOOTSTRAP_ADMIN_PASSWORD=' .env | cut -d= -f2-)
          json() { python3 -c "import json, sys; print(json.load(sys.stdin)$1)"; }
          login=$(curl -fsS -D login-headers.txt -H 'Content-Type: application/json' \
            -d "{\"email\": \"$email\", \"password\": \"$password\"}" \
            http://localhost:3000/api/v1/auth/login)
          token=$(printf '%s' "$login" | json "['accessToken']")
          cookie=$(grep -i '^set-cookie: refresh_token=' login-headers.txt \
            | sed -E 's/^[^:]+: (refresh_token=[^;]*).*/\1/')
          role=$(curl -fsS -H "Authorization: Bearer $token" \
            http://localhost:3000/api/v1/auth/me | json "['role']")
          test "$role" = ADMIN
          curl -fsS -X POST -H 'Origin: http://localhost:3000' -H "Cookie: $cookie" \
            http://localhost:3000/api/v1/auth/refresh | json "['user']['role']"
          printf '%%PDF-1.4\n1 0 obj <</Type/Catalog/Pages 2 0 R>> endobj\n2 0 obj <</Type/Pages/Kids[3 0 R]/Count 1>> endobj\n3 0 obj <</Type/Page/Parent 2 0 R/MediaBox[0 0 612 792]>> endobj\ntrailer <</Root 1 0 R>>\n%%%%EOF\n' > ci.pdf
          id=$(curl -fsS -H "Authorization: Bearer $token" \
            -F 'file=@ci.pdf;type=application/pdf' \
            -F 'metadata={"title": "CI upload"};type=application/json' \
            http://localhost:3000/api/v1/documents | json "['id']")
          curl -fsS -H "Authorization: Bearer $token" -o downloaded.pdf \
            "http://localhost:3000/api/v1/documents/$id/content"
          cmp ci.pdf downloaded.pdf
          head -c 31457281 /dev/zero > too-large.pdf
          status=$(curl -sS -o too-large.json -w '%{http_code}' -H "Authorization: Bearer $token" \
            -F 'file=@too-large.pdf;type=application/pdf' \
            -F 'metadata={"title": "Too large"};type=application/json' \
            http://localhost:3000/api/v1/documents)
          test "$status" = 413
          test "$(json "['code']" < too-large.json)" = FILE_TOO_LARGE

      - name: Container logs
        if: failure()
        run: docker compose logs
