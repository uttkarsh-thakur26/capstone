# Backend on the host with hot reload, database in Docker Compose (DEP-3, ADR-013).
# Start the database with `docker compose up -d db` from the repository root.
spring:
  config:
    # Reads the repository's .env, so the backend uses the same values as Compose.
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
