# Backend on the host with hot reload, database in Docker Compose (DEP-3, ADR-013).
# Start the database with `docker compose up -d db` from the repository root.
spring:
  config:
    # Reads the repository's .env, so the backend uses the same values as Compose. The path is
    # relative to the working directory: ../.env from backend/, .env from the repository root.
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  security:
    # The Vite dev server is the interface's origin in development mode (DEP-3).
    allowed-origins: http://localhost:5173
    # Plain HTTP on localhost. Only this profile may turn Secure off (AUTH-6).
    refresh-cookie-secure: false
  storage:
    # Relative to the working directory: data/files in the repository when started from backend/.
    # Ignored by git.
    root: ${APP_STORAGE_ROOT:../data/files}
