spring:
  application:
    name: knowledge-platform
  jpa:
    # No database connection is held open while a view renders (specification 4.5).
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks it (specification 7.1).
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health
