spring:
  application:
    name: knowledge-platform
  jpa:
    # No database connection is held open while a view renders (specification 4.5).
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks it (specification 7.1).
      ddl-auto: validate
  flyway:
    placeholders:
      # The dimension of document_chunk.embedding (DATA-4). Checked against the column at startup.
      embedding_dim: ${app.embedding.dimensions}
  ai:
    model:
      embedding: ollama
      # D5, ADR-036. `none` runs the application without a chat model: everything works except
      # asking, which answers 503.
      chat: ${CHAT_PROVIDER:openai}
      # The OpenAI starter switches these on unless told otherwise; the application uses none.
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    chat:
      client:
        # The assistant calls the ChatModel itself, so no advisor can add tools or retries (RAG-7).
        enabled: false
    openai:
      # Required while the provider is openai; never logged (SEC-10).
      api-key: ${OPENAI_API_KEY:}
      # RAG-6: one retry of a transient failure, in the SDK only (S16), and 60 s per attempt.
      max-retries: 1
      timeout: 60s
      chat:
        model: ${OPENAI_CHAT_MODEL:gpt-6-luna}
        # Reasoning tokens are billed as output; answers come from the sources, not from reasoning.
        reasoning-effort: ${OPENAI_REASONING_EFFORT:none}
        # RAG-6. gpt-6-luna accepts it with reasoning effort none (checked 2026-11-01, S17).
        temperature: 0.1
        # Answers are short (11.3); the cap keeps a runaway answer cheap.
        max-completion-tokens: 2048
        # Questions and answers are not kept by the provider for its own tools.
        store: false
    ollama:
      # Ollama runs on the host so it can use the GPU. Compose sets the container's address.
      base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
    retry:
      # Request timeout and rate limit are worth retrying; other 4xx answers are not (ING-8).
      on-http-codes: 408,429
  http:
    clients:
      # Every RestClient, which today means Ollama. A batch of 16 chunks takes seconds on a GPU.
      connect-timeout: 5s
      read-timeout: 120s
  task:
    scheduling:
      pool:
        # Ingestion poll, heartbeat and recovery, and the file cleanup, never wait for each other.
        size: 2

server:
  # Tomcat reads X-Forwarded-For only from proxies on private or loopback addresses, which is where
  # nginx runs in Compose, and nginx sets it to the real client address (ADR-024).
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    # It logs the whole prompt, document text included, when a response has no choice (SEC-10).
    org.springframework.ai.openai.OpenAiChatModel: error

# The OpenAPI document and Swagger UI exist only in the dev profile (AUTH-8, ADR-014).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  # Required. The application refuses to start without it (D1, ADR-007).
  display-name: ${APP_DISPLAY_NAME:}
  security:
    # Required: base64 of at least 32 random bytes, for example `openssl rand -base64 32` (AUTH-6).
    jwt-secret: ${APP_SECURITY_JWT_SECRET:}
    # Required, comma-separated: the origins that serve the interface (AUTH-9). Never a wildcard.
    allowed-origins: ${APP_SECURITY_ALLOWED_ORIGINS:}
  registration:
    # Comma-separated. Empty means anyone may register, always as a STUDENT (AUTH-1).
    allowed-email-domains: ${APP_REGISTRATION_ALLOWED_EMAIL_DOMAINS:}
  bootstrap-admin:
    # Required while no admin exists; there is no built-in account (AUTH-3).
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
    display-name: ${APP_BOOTSTRAP_ADMIN_DISPLAY_NAME:Administrator}
  storage:
    # Required: the directory that holds uploaded files (D8). Compose mounts a volume there.
    root: ${APP_STORAGE_ROOT:}
  embedding:
    # D6, ADR-033. Changing the model needs a full re-index; the application refuses to start
    # while indexed documents come from another model (S11).
    model: ${APP_EMBEDDING_MODEL:qwen3-embedding:0.6b}
    dimensions: ${APP_EMBEDDING_DIMENSIONS:1024}
  ingestion:
    # 5 minutes without a heartbeat means the worker died (ING-2, ADR-034).
    stuck-timeout: ${APP_INGESTION_STUCK_TIMEOUT:5m}
  upload:
    # DOC-1. nginx accepts bodies up to 30MB, so raising this above about 29MB needs nginx too.
    max-file-size: ${APP_UPLOAD_MAX_FILE_SIZE:25MB}
