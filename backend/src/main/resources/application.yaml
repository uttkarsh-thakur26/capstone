spring:
  application:
    name: knowledge-platform
  jpa:
    # No database connection is held open while a view renders (specification 4.5).
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks it (specification 7.1).
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health

# The OpenAPI document and Swagger UI exist only in the dev profile (AUTH-8, ADR-014).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  # Required. The application refuses to start without it (D1, ADR-007).
  display-name: ${APP_DISPLAY_NAME:}
