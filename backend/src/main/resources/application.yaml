spring:
  application:
    name: knowledge-platform
  jpa:
    # No database connection is held open while a view renders (specification 4.5).
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks it (specification 7.1).
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health

# The OpenAPI document and Swagger UI exist only in the dev profile (AUTH-8, ADR-014).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  # Required. The application refuses to start without it (D1, ADR-007).
  display-name: ${APP_DISPLAY_NAME:}
  security:
    # Required: base64 of at least 32 random bytes, for example `openssl rand -base64 32` (AUTH-6).
    jwt-secret: ${APP_SECURITY_JWT_SECRET:}
    # Required, comma-separated: the origins that serve the interface (AUTH-9). Never a wildcard.
    allowed-origins: ${APP_SECURITY_ALLOWED_ORIGINS:}
  registration:
    # Comma-separated. Empty means anyone may register, always as a STUDENT (AUTH-1).
    allowed-email-domains: ${APP_REGISTRATION_ALLOWED_EMAIL_DOMAINS:}
  bootstrap-admin:
    # Required while no admin exists; there is no built-in account (AUTH-3).
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
    display-name: ${APP_BOOTSTRAP_ADMIN_DISPLAY_NAME:Administrator}
