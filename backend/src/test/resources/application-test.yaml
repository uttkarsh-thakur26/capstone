# Settings for automated tests (profile "test", specification 18).
app:
  display-name: Test platform
  security:
    # Base64 of the 32 bytes "test-only-signing-key-not-secret". A test value, not a secret.
    jwt-secret: dGVzdC1vbmx5LXNpZ25pbmcta2V5LW5vdC1zZWNyZXQ=
    allowed-origins: http://localhost:3000
  # Test-only account. The .invalid domain is reserved and never delivers mail.
  bootstrap-admin:
    email: admin@test.invalid
    password: test-only-admin-password
  storage:
    # Removed by `mvn clean` together with the rest of the build output.
    root: target/test-files
    # Tests call the retry themselves; a timed run in the middle of one would race with it.
    cleanup-interval: 1h
  upload:
    # Small, so the oversized-file test needs no large file. The 25MB default is tested on its own.
    max-file-size: 256KB
