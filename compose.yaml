# The whole system: `docker compose up --build` (DEP-1, DEP-2).
# Development mode runs only `db` here and the backend and frontend on the host (DEP-3).
name: knowledge-platform

services:
  db:
    # pgvector 0.8.7 on PostgreSQL 18, pinned by digest (ADR-015). The tests use the same digest.
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql (specification 3.3).
      - db-data:/var/lib/postgresql
    ports:
      # Only for the backend running on the host in development mode.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DISPLAY_NAME: ${APP_DISPLAY_NAME:?set APP_DISPLAY_NAME in .env}
      APP_SECURITY_JWT_SECRET: ${APP_SECURITY_JWT_SECRET:?set APP_SECURITY_JWT_SECRET in .env}
      APP_SECURITY_ALLOWED_ORIGINS: ${APP_SECURITY_ALLOWED_ORIGINS:?set APP_SECURITY_ALLOWED_ORIGINS in .env}
      # Needed only while the database has no admin; the backend says so if they are missing.
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      APP_REGISTRATION_ALLOWED_EMAIL_DOMAINS: ${APP_REGISTRATION_ALLOWED_EMAIL_DOMAINS:-}
      # Uploaded files live on their own volume (D8, ADR-029). Back it up with the database.
      APP_STORAGE_ROOT: /var/lib/knowledge-platform/files
      # nginx accepts request bodies up to 30MB, so keep this below about 29MB (ADR-031).
      APP_UPLOAD_MAX_FILE_SIZE: ${APP_UPLOAD_MAX_FILE_SIZE:-25MB}
      # Ollama runs on the host so it can use the GPU (D6, ADR-033). Without it the backend still
      # starts; documents wait as UPLOADED until the model answers (ADR-034).
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_FROM_CONTAINER:-http://host.docker.internal:11434}
      APP_EMBEDDING_MODEL: ${APP_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      APP_EMBEDDING_DIMENSIONS: ${APP_EMBEDDING_DIMENSIONS:-1024}
    extra_hosts:
      # Docker Desktop provides host.docker.internal; on Linux this line does.
      - "host.docker.internal:host-gateway"
    volumes:
      - document-files:/var/lib/knowledge-platform/files
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # The JRE image has no curl or wget, so bash sends the HTTP request itself.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /actuator/health/readiness HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  db-data:
  document-files:
