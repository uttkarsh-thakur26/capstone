server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Docker's DNS. With the address in a variable, nginx looks the backend up again when the
  # answer expires, so a recreated backend container with a new IP is still reached.
  resolver 127.0.0.11 valid=10s;
  set $backend http://backend:8080;

  # The API is served on the same origin as the SPA (AUTH-9, DEP-1).
  location /api/ {
    # Uploads: the backend's 25MB file limit plus the multipart overhead (DOC-1, ADR-031), so the
    # backend answers anything up to here. A larger body is refused by nginx itself.
    client_max_body_size 30m;
    error_page 413 = @too_large;
    proxy_pass $backend;
    proxy_set_header Host $host;
    # The address nginx received the connection from, replacing anything the client sent, so a
    # client cannot put a false address into the audit log (ADR-024).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # nginx's own 413, as Problem Details with the backend's code, so the SPA handles both alike
  # (ADR-023).
  location @too_large {
    default_type application/problem+json;
    return 413 '{"type":"about:blank","title":"Content Too Large","status":413,"detail":"The file is larger than the upload limit.","code":"FILE_TOO_LARGE"}';
  }

  # Client-side routes fall back to the SPA. SEC-6: the page's own policy. Scripts, styles,
  # fonts and requests stay on this origin; PDFs are shown from blob: URLs that the page itself
  # creates (ADR-038); no other site may frame the page. API responses carry the backend's stricter
  # policy, so these headers are set here only. The one style hash is React Aria's own injected
  # rule (touch-action on pressable controls); an upgrade that changes it shows a CSP error in the
  # browser console, and the new hash goes here.
  location / {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'sha256-38RhXrc7EdReTKsOm23ZPOCUgniTUUcjky8QOOrQx6o='; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    try_files $uri /index.html;
  }
}
